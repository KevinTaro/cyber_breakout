# Cloudflare Workers & Static Assets Configuration
name = "cyber-breakout"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# (Optional) Bind a Cloudflare KV namespace for persistent multi-region high scores:
# Run: npx wrangler kv namespace create LEADERBOARD_KV
# Then uncomment and replace the id below:
# [[kv_namespaces]]
# binding = "LEADERBOARD_KV"
# id = "your-kv-namespace-id"

# Environment variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "Cyber Breakout"
